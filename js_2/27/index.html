<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Slider</title>
        <style>
            * * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html,
            body,
            #app {
                width: 100%;
                height: 100%;
            }

            img {
                display: block;
            }

            #app {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #slider-container {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: space-around;
                flex-wrap: wrap;
            }

            .nav {
                font-size: 60px;
                cursor: pointer;
                user-select: none;
            }

            .dot:hover,
            .nav:hover {
                transform: scale(1.25);
                transition: transform 0.2s;
            }

            #slider {
                overflow: hidden;
            }

            #slider-track {
                display: flex;
                flex-direction: row;
                transition: transform 0.2s;
            }

            .slide {
                /* transform: translateX(0); */
            }

            #dots {
                width: 100%;
                margin-top: 20px;
                display: flex;
                justify-content: center;
            }

            .dot {
                width: 30px;
                height: 30px;
                border-radius: 50%;
                background-color: paleturquoise;
                margin: 5px;
                cursor: pointer;
                opacity: 0.5;
            }

            .dot.active {
                opacity: 1;
                transition: opacity 0.2s;
            }

            .control {
                position: absolute;
                top: 20px;
                font-size: 60px;
                cursor: pointer;
            }

            .control#start {
                left: 20px;
            }

            .control#stop {
                left: 100px;
            }
        </style>
    </head>

    <body>
        <div id="app">
            <div class="control" id="start">▶️</div>
            <div class="control" id="stop">⏸️</div>

            <div id="slider-container">
                <div class="nav" id="prev">⬅️</div>

                <div id="slider">
                    <div id="slider-track">
                        <div class="slide">
                            <img src="./images/1.jpg" alt="1">
                        </div>
                        <div class="slide">
                            <img src="./images/2.jpg" alt="2">
                        </div>
                        <div class="slide">
                            <img src="./images/3.jpg" alt="3">
                        </div>
                        <div class="slide">
                            <img src="./images/4.jpg" alt="4">
                        </div>
                    </div>
                </div>

                <div class="nav" id="next">➡️</div>

                <div id="dots">

                </div>
            </div>
        </div>

        <script src="./script.js"></script>
    </body>

</html>
