<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Slider</title>

        <!-- <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script> -->
        <script src="./js/jquery.js"></script>

    </head>

    <body>

        <h1></h1>
        <form id="form">
            <label for="email">
                Email
                <input type="text" id="email">
            </label>
            <br>
            <br>
            <label for="phone">
                Phone
                <input type="text" id="phone">
            </label>
            <br><br>
            <button id="showEmail">showEmail</button>
            <button type="submit">Submit</button>

        </form>

        <script src="./script.js"></script>
        <script>
            const form = document.getElementById('form');

            // yaremiyroman@gmail.com
            // liter digits _ - .
            // @
            //CHARSdigits
            // .
            //CHARSdigits > 2
            const emailRegexp = /^[\w-.]+@[\w-.]+\.[a-zA-Z]{2,}$/;

            //  +380  731234567
            // +380
            // digits 9 штук
            const phoneRegExp = /^\+380\d{9}$/;

            let isValid = false;


            form.addEventListener('submit', function (e) {
                e.preventDefault();

                const emailValue = document.getElementById('email').value.trim();
                const phoneValue = document.getElementById('phone').value.trim();


                const isEmailValid = emailRegexp.test(emailValue);
                const isPhoneValid = phoneRegExp.test(phoneValue);

                console.log(isEmailValid, isPhoneValid);

                if (isEmailValid && isPhoneValid) {
                    isValid = true
                }

                if (isValid) {
                    alert('Все добре');

                    isValid = false;
                } else {
                    alert('Проблеми');
                }
            });


        </script>
    </body>

</html>
